<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>devsync-frontend</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script type="module"> 
    import { routesConst } from './src/routes.constants.ts';

      const worker = new Worker(new URL('/refreshToken.ts', import.meta.url), { type: 'module' })
      if (!window.location.href.includes(routesConst.login)) {
        worker.postMessage('start')
      }

      worker.onmessage = (message) => {
        if (message.data === 'login') {
          window.location.href = routesConst.login
        }
      }

    </script>
  </body>
</html>
